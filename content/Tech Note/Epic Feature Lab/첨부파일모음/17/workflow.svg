<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
<rect width="1200" height="660" fill="#101b2a"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" fill="#f3f7ff">
<text x="50" y="65" font-size="32" font-weight="bold">Lore로 남긴 로컬 복원 기준</text>
<text x="50" y="105" font-size="19" fill="#a8c6e7">프로젝트 폴더에서 실행한 실제 오프라인 작업 순서</text>
<rect x="45" y="145" width="1110" height="90" rx="12" fill="#1d3047"/>
<text x="68" y="177" font-size="21" fill="#84dfc5">1 · stage --scan</text>
<text x="365" y="177" font-size="23">변경 파일 모으기</text>
<text x="365" y="209" font-size="17" fill="#c0ccdc">텍스트와 바이너리 에셋을 같은 프로젝트 이력으로 준비</text>
<rect x="45" y="253" width="1110" height="90" rx="12" fill="#1d3047"/>
<text x="68" y="285" font-size="21" fill="#84dfc5">2 · commit</text>
<text x="365" y="285" font-size="23">검증한 상태를 이력에 저장</text>
<text x="365" y="317" font-size="17" fill="#c0ccdc">완성 프로젝트의 기준은 revision 16</text>
<rect x="45" y="361" width="1110" height="90" rx="12" fill="#1d3047"/>
<text x="68" y="393" font-size="21" fill="#84dfc5">3 · repository verify</text>
<text x="365" y="393" font-size="23">저장소 무결성 검사</text>
<text x="365" y="425" font-size="17" fill="#c0ccdc">내용과 해시를 검증한 뒤 복원 기준으로 사용</text>
<rect x="45" y="469" width="1110" height="90" rx="12" fill="#1d3047"/>
<text x="68" y="501" font-size="21" fill="#84dfc5">4 · restore / compare</text>
<text x="365" y="501" font-size="23">복원하고 원본과 비교</text>
<text x="365" y="533" font-size="17" fill="#c0ccdc">파일이 열리는지와 실제 내용이 일치하는지를 나눠 확인</text>
<text x="50" y="625" font-size="17" fill="#a8c6e7">실제 기록을 설명한 도식입니다. 에디터나 게임 실행 화면 캡처가 아닙니다.</text>
</g></svg>